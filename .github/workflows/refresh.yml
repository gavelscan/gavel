name: Refresh the record

# The pages are built from a snapshot, so the snapshot has to be cut on a
# schedule or the freshness chip in the header just keeps counting up.
# GitHub's scheduler is best-effort and often runs late; that is acceptable
# here precisely because the site states its own staleness rather than
# implying it is live.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Never let two refreshes race for the archive or the cursor.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull new events into the archive
        run: python -m gavel.watch --backfill

      - name: Refresh the issuer registry
        # Fail-soft: a stale registry reads as "unknown", never as a false
        # verified badge, so a bad fetch must not fail the whole refresh.
        run: python -m gavel.registry || echo "registry refresh failed; keeping the cached copy"

      - name: Rebuild the feed, deployer index and API
        run: |
          python scripts/build_feed.py
          python scripts/build_deployers.py
          cp data/feed.json site/src/app/feed.json
          cp data/deployers.json site/src/app/deployers.json
          python scripts/build_api.py
          python scripts/build_hero.py

      - name: Commit only if the record actually moved
        run: |
          git config user.name  "gavelscan"
          git config user.email "gavelscan@users.noreply.github.com"
          git add site/src/app/feed.json site/src/app/deployers.json \
                  site/src/app/launches.json site/public/v1 \
                  gavel/rhj_registry.json
          if git diff --cached --quiet; then
            echo "no change at this block; nothing to publish"
            exit 0
          fi
          HEAD_BLOCK=$(python -c "import json;print(json.load(open('data/feed.json'))['head'])")
          git commit -m "data: record refreshed at block ${HEAD_BLOCK}"
          git push
